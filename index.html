<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pokemon</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <h1 id="title">Pick a Song</h1>
    <label id="name-entry">
      Enter Your Name
      <input type="text" name="name-entry" />
    </label>
    <div id="choice-container">
      <div id="choice-1" class="choice">
        <iframe
          src="https://www.youtube.com/embed/YQHsXMglC9A"
          referrerpolicy="strict-origin-when-cross-origin"
          allow="
            accelerometer;
            autoplay;
            clipboard-write;
            encrypted-media;
            gyroscope;
            picture-in-picture;
            web-share;
          "
          allowfullscreen
        ></iframe>
        <button>Song A</button>
      </div>
      <div id="choice-2" class="choice">
        <iframe
          src="https://www.youtube.com/embed/OPf0YbXqDm0"
          referrerpolicy="strict-origin-when-cross-origin"
          allow="
            accelerometer;
            autoplay;
            clipboard-write;
            encrypted-media;
            gyroscope;
            picture-in-picture;
            web-share;
          "
          allowfullscreen
        ></iframe>
        <button>Song B</button>
      </div>
    </div>
    <script src="main.js"></script>
  </body>
</html>
